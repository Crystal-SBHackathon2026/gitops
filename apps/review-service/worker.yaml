# 검토 워커. Kafka review.requested·review.resumed 를 받아 검토 그래프를 돌린다. API 포트는 없고 지표 포트(9100)만 연다.
# 체크포인트를 업무 DB 에 두므로 재시작해도 사람 확인·CI 대기 중인 검토가 이어진다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-worker
  labels:
    app: review-worker
spec:
  replicas: 1
  strategy:
    type: Recreate  # 컨슈머 그룹 재조정 중 같은 메시지를 두 워커가 잡지 않게 한 대씩
  selector:
    matchLabels:
      app: review-worker
  template:
    metadata:
      labels:
        app: review-worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/crystal-sbhackathon2026/review-worker
          ports:
            - {name: metrics, containerPort: 9100}  # prometheus_client /metrics (METRICS_PORT)
          envFrom:
            - configMapRef:
                name: review-service
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: {name: review-db-credentials, key: username}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: review-db-credentials, key: password}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: review-service-secrets, key: ANTHROPIC_API_KEY, optional: true}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef: {name: review-service-secrets, key: GITHUB_TOKEN, optional: true}
          # 의미 검색용 임베딩 모델(fastembed 다국어 MiniLM)을 메모리에 올린다. 실측: 모델 없이 106Mi →
          # 모델 + 검색 약 690MB(VmHWM). 검토 그래프·judge 까지 약 800MB 로 보고 요청 1Gi, 상한은 그 2배
          resources:
            requests: {cpu: 100m, memory: 1Gi}
            limits: {cpu: 500m, memory: 2Gi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
# 워커 지표 — ServiceMonitor(monitoring/servicemonitors.yaml)가 이 Service 의 metrics 포트를 긁는다.
apiVersion: v1
kind: Service
metadata:
  name: review-worker-metrics
  labels:
    app: review-worker
spec:
  type: ClusterIP
  selector:
    app: review-worker
  ports:
    - {name: metrics, port: 9100, targetPort: metrics}
