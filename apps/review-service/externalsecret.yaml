# review-service-secrets — 검토 서비스 비밀값. 인프라 ESO 의 SecretStore review-db(Pod Identity)로 Secrets Manager 에서 동기화한다.
#  - oneaction/review-service (JSON): ANTHROPIC_API_KEY, GITHUB_WEBHOOK_SECRET, ARGOCD_WEBHOOK_TOKEN
#    키가 하나라도 없으면 ESO 가 시크릿 전체 동기화에 실패한다
#  - oneaction/gitops-token (평문): 앱 레포·gitops 쓰기 토큰 → GITHUB_TOKEN
# ESO 역할에 두 시크릿 ARN 읽기 권한이 있어야 한다 (인프라 eks-eso).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: review-service-secrets
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: review-db
    kind: SecretStore
  target:
    name: review-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: oneaction/review-service
        property: ANTHROPIC_API_KEY
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: oneaction/review-service
        property: GITHUB_WEBHOOK_SECRET
    - secretKey: ARGOCD_WEBHOOK_TOKEN
      remoteRef:
        key: oneaction/review-service
        property: ARGOCD_WEBHOOK_TOKEN
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: oneaction/gitops-token  # 평문 시크릿이라 property 없음
