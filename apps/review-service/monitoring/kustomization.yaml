# 검토 서비스 모니터링 — 상위 apps/review-service/kustomization.yaml 의 resources 에 들어 있다.
# ServiceMonitor CRD(kube-prometheus-stack)와 Secrets Manager GRAFANA_DB_PASSWORD·DB 사용자 grafana_ro 가 있어야 한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - servicemonitors.yaml
  - grafana-datasource.yaml  # GRAFANA_DB_PASSWORD 를 Secrets Manager 에 넣은 뒤
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: platform  # 설치된 sidecar 의 FOLDER_ANNOTATION=grafana_folder
configMapGenerator:
  - name: review-dashboard-platform
    files:
      - dashboards/platform-overview.json
  - name: review-dashboard-commit-timeline
    files:
      - dashboards/commit-timeline.json
