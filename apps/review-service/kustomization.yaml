# 검토 서비스(Review API + 워커). AWS EKS oneaction 의 platform 네임스페이스에만 배포한다.
# DB 계정 Secret review-db-credentials 가 platform 에만 있기 때문이다 (인프라 ESO 가 관리).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform
resources:
  - configmap.yaml
  - api.yaml
  - worker.yaml
  - qdrant.yaml  # 근거 문서 벡터 검색. 디스크 없이 뜨고 indexer 컨테이너가 다시 색인한다
  - externalsecret.yaml  # review-service-secrets (ANTHROPIC_API_KEY·GITHUB_TOKEN·웹훅 비밀값)
  - targetgroupbinding.yaml  # 플랫폼 ALB(oneaction-alb) → platform-tg → Service platform:8080
images:
  - name: ghcr.io/crystal-sbhackathon2026/review-api
    # review-service CI(update-gitops)가 main 커밋 SHA 로 자동 갱신한다
    newTag: 3229fd2870b6f91ba68f4467a270e52c24d99990
  - name: ghcr.io/crystal-sbhackathon2026/review-worker
    newTag: 3229fd2870b6f91ba68f4467a270e52c24d99990
