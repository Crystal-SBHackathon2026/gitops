# 검토 서비스(Review API + 워커). AWS EKS oneaction 의 platform 네임스페이스에만 배포한다.
# DB 계정 Secret review-db-credentials 가 platform 에만 있기 때문이다 (인프라 ESO 가 관리).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform
resources:
  - configmap.yaml
  - api.yaml
  - worker.yaml
  # targetgroupbinding.yaml — 플랫폼 ALB 연결. EKS 6단계(찬건님)와 같이 적용한 뒤 여기에 추가한다
images:
  - name: ghcr.io/crystal-sbhackathon2026/review-api
    # review-service CI(update-gitops)가 main 커밋 SHA 로 자동 갱신한다
    newTag: latest
  - name: ghcr.io/crystal-sbhackathon2026/review-worker
    newTag: latest
