# Review API. Service 이름 platform·포트 8080 은 플랫폼 ALB 타깃 그룹(platform-tg, IP 타입, GET /healthz)과 맞춘다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-api
  labels:
    app: review-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-api
  template:
    metadata:
      labels:
        app: review-api
    spec:
      containers:
        - name: api
          image: ghcr.io/crystal-sbhackathon2026/review-api
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: review-service
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: {name: review-db-credentials, key: username}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: review-db-credentials, key: password}
            - name: ANTHROPIC_API_KEY  # 형식이 깨진 deploy.yaml 복구(intake, review-service#25)가 API 에서 Claude 를 부른다
              valueFrom:
                secretKeyRef: {name: review-service-secrets, key: ANTHROPIC_API_KEY, optional: true}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef: {name: review-service-secrets, key: GITHUB_TOKEN, optional: true}
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: {name: review-service-secrets, key: GITHUB_WEBHOOK_SECRET, optional: true}
            - name: REVIEW_API_TOKEN  # POST /reviews·/decision 인증. 비어 있으면 그 경로는 503 (fail-closed)
              valueFrom:
                secretKeyRef: {name: review-service-secrets, key: REVIEW_API_TOKEN, optional: true}
            - name: ARGOCD_WEBHOOK_TOKEN  # /webhooks/argocd 의 Bearer 토큰. 비어 있으면 503 (review-service#43 부터 fail-closed)
              valueFrom:
                secretKeyRef: {name: review-service-secrets, key: ARGOCD_WEBHOOK_TOKEN, optional: true}
            # 배포 진행 화면(/ui/reviews/{id})의 환경별 앱 주소 (review-service#50). http(s) 만 받는다.
            # aws 는 sample-app ingress ADDRESS (10/09 장애 뒤 새로 만든 ALB), local 은 로컬 k3s 의 sample-app 포트(localhost:8081)
            - name: APP_URLS
              value: '{"sample-app": {"aws": "http://k8s-sampleap-sampleap-88af4f1f82-400100408.ap-northeast-2.elb.amazonaws.com", "local": "http://localhost:8081"}}'
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: platform
  labels:
    app: review-api
spec:
  selector:
    app: review-api
  ports:
    - name: http
      port: 8080
      targetPort: http
