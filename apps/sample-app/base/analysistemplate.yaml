# 카나리 단계에서 새 버전이 멀쩡한지 재는 분석.
#
# 앱을 직접 불러 응답 내용을 본다. 10초마다 6번(약 60초) 재고, 기준을 넘으면
# Argo Rollouts 가 배포를 중단하고 이전 버전으로 되돌린다.
#
# 🔴 Prometheus 기반 error-rate 지표는 2026-10-09 20:50 에 여기서 뺐다.
# base 를 세 환경이 공유하는데 Prometheus 가 AWS 에만 있어서, 없는 환경의 카나리가
# 전부 중단됐다. 자세한 것은 이 파일 맨 아래 주석과 이슈 #24 를 보라.
#
# ⚠️ URL 은 반드시 FQDN 이어야 한다. web 프로바이더는 argo-rollouts 컨트롤러 파드에서
# 실행되므로 짧은 이름 sample-app 은 argo-rollouts 네임스페이스에서 찾다가 실패한다.
#   실측: dial tcp: lookup sample-app ... no such host  →  카나리 배포가 전부 중단됨
# 네임스페이스가 박혀 있다. 명세의 target.namespace 를 바꾸면 이 값도 같이 바꿔야 한다.
# aws·local·gcp overlay 모두 sample-app 을 쓰고 있어 지금은 하나로 충분하다.
#
# ⚠️ failureLimit 과 consecutiveErrorLimit 은 다르다 (실측으로 확인).
#   Failed = successCondition 이 거짓      → failureLimit 적용
#   Error  = 측정 자체가 안 됨(연결 실패,
#            5xx, 기대한 JSON 필드 없음)   → consecutiveErrorLimit 적용 (기본 4)
# 앱이 500 을 주면 body 에 app 필드가 없어 Error 로 잡히므로 둘 다 낮춰야 한다.
#
# 이 분석이 잡는 것과 못 잡는 것
#   잡는다   파드는 Ready 인데 응답이 계속 틀린 경우 (잘못된 이미지, 설정 오류)
#   이미 있다 readiness 실패는 Rollouts 가 progressDeadline 으로 되돌린다 (10/7 검증)
#   못 잡는다 일부 요청만 실패하는 부분 에러율. Service 가 카나리·안정 파드를 함께
#            가리켜 요청이 번갈아 가므로 연속 오류가 잘 안 생긴다
#            → 그래서 error-rate 를 더했다 (이슈 #24)
#
# Service 가 양쪽을 함께 가리키는 건 의도한 것이다. canaryService·stableService 를 쓰면
# ALB 가 안정 Service 만 보게 되어 "절반이 새 버전을 본다"가 깨진다.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: sample-app-health
spec:
  metrics:
    - name: api-ok
      interval: 10s
      count: 6
      failureLimit: 1              # 2번째 Failed 에서 중단
      consecutiveErrorLimit: 2     # 3번 연속 Error 에서 중단
      provider:
        web:
          url: http://sample-app.sample-app.svc.cluster.local/api/info
          timeoutSeconds: 5
          jsonPath: "{$.app}"
      successCondition: result == "sample-app"


# ──────────────────────────────────────────────────────────────────────────
# 🔴 error-rate 지표를 여기서 뺀 이유 (2026-10-09 20:50)
#
# 넣은 뒤(#39, #41) **Prometheus 가 없는 환경의 카나리가 전부 중단됐다.**
# 로컬 k3s 에서 실측:
#
#   error-rate: 오류=7, 측정수=(비어 있음)
#   consecutiveErrors (7) > consecutiveErrorLimit (6)
#   dial tcp: lookup monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local
#   on 10.43.0.10:53: no such host
#   → Rollout phase=Degraded abort=true  (로컬 카나리 2회 연속 실패)
#
# 같은 일을 박찬건이 GKE 에서도 봤다 (DNS 오류 7회 후 Error).
#
# ⚠️ 내가 틀린 지점 — `consecutiveErrorLimit` 을 `count` 와 같게 두면 안전하다고 봤다.
# "오류가 count 를 넘을 수 없으니 중단되지 않는다" 고 생각했는데 **틀렸다.**
#
#   count                  성공·실패한 측정만 센다
#   오류(Error)            count 을 소모하지 않는다. 무한히 재시도된다
#
# 그래서 Prometheus 가 영구히 없으면 어떤 유한한 consecutiveErrorLimit 도 결국 넘는다.
# count 와 같게 두는 것은 보호가 아니라 중단을 몇 초 늦추는 것뿐이었다.
# (#41 로 4 로 줄였으니 오히려 더 빨리 중단됐다)
#
# 다시 넣으려면 환경별로 달라야 한다. 선택지 세 가지 — 팀 합의가 필요하다.
#
#   ① 환경마다 Prometheus 를 둔다
#      로컬·GKE 에 최소 Prometheus 설치. 지표가 모든 환경에서 같이 동작한다.
#      비용: 환경마다 설치·운영. 로컬은 노트북이라 자리를 먹는다
#
#   ② overlay 렌더러가 환경별로 analysis 템플릿을 고른다 (김연재)
#      이미 rollout.strategy 를 환경별로 고르고 있으니 같은 자리에 붙는다.
#      가장 깔끔하지만 렌더러 변경이 필요하다
#
#   ③ base 를 환경별로 분리한다
#      CI 가 갱신하는 newTag 가 base/kustomization.yaml 에 있어서 그것도 갈라진다.
#      변경 범위가 가장 크다
#
# 그동안 카나리는 아래 api-ok 가 지킨다. 응답이 계속 틀리면 중단된다.
# 못 잡는 것은 "일부 요청만 실패" 다 — 실측으로 확인했다 (#24 코멘트).
# ──────────────────────────────────────────────────────────────────────────
