# Argo CD Application: GitOps 레포의 aws overlay를 해당 클러스터에 동기화한다.
# Argo CD를 oneaction EKS 안에 설치하므로(in-cluster) 목적지는 kubernetes.default.svc를 사용한다.
# Argo CD를 클러스터 밖에 두는 경우에만 EKS API 주소와 CA로 클러스터를 등록하고 이 값을 바꾼다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app-aws
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Crystal-SBHackathon2026/gitops.git
    targetRevision: main
    path: apps/sample-app/overlays/aws
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
