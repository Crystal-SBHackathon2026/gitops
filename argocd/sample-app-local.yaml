# Argo CD Application: GitOps 레포의 local overlay를 부산 로컬 k3s 클러스터에 동기화한다.
#
# ⚠️ destination.server 를 kubernetes.default.svc 로 두면 안 된다.
# Argo CD 가 EKS 안에 있으므로 그 값은 "EKS 자신"을 뜻한다. 그대로 활성화하면
# 로컬 설정이 EKS 에 배포되어 aws overlay 를 덮어쓴다. 네임스페이스가 둘 다
# sample-app 이라 같은 Rollout·Service·Ingress 를 서로 밀어낸다.
#
# 클러스터를 Argo CD 에 등록한 뒤 아래 값을 실제 주소로 바꾼다.
# 등록 전에는 이 파일을 적용하지 않는다 (지금 클러스터에 적용된 Application 은
# sample-app-aws 와 review-service-aws 둘뿐이다).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Crystal-SBHackathon2026/gitops.git
    targetRevision: main
    path: apps/sample-app/overlays/local
  destination:
    server: LOCAL_K3S_API_SERVER
    namespace: sample-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
