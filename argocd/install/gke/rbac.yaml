# GKE namespace 권한만 준비한다. 인증값 발급과 중앙 EKS 등록은 별도 인계한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-deployer
  namespace: sample-app
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-deployer
  namespace: sample-app
rules:
  # Argo CD의 namespace 캐시/상태 조회. sample-app 밖에는 적용되지 않는다.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: [get, list, watch]
  # 현재 DB 없는 sample-app 선언에 필요한 쓰기만 허용한다.
  - apiGroups: [""]
    resources: [services]
    verbs: [create, update, patch, delete]
  - apiGroups: [argoproj.io]
    resources: [rollouts, analysistemplates]
    verbs: [create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-deployer
  namespace: sample-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-deployer
subjects:
  - kind: ServiceAccount
    name: argocd-deployer
    namespace: sample-app
