# Public configuration; no runtime token or private key is stored here.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-tokyo-gke
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: tokyo-gke
  server: https://34.146.143.116
  namespaces: sample-app
  clusterResources: 'false'
  config: |
    {
      "execProviderConfig": {
        "command": "argocd-k8s-auth",
        "args": [
          "gcp"
        ],
        "apiVersion": "client.authentication.k8s.io/v1beta1",
        "env": {
          "GOOGLE_APPLICATION_CREDENTIALS": "/etc/crystal-gcp-wif/credential-configuration.json"
        }
      },
      "tlsClientConfig": {
        "insecure": false,
        "caData": ""
      }
    }
