# Argo CD Application: GitOps 레포의 gcp overlay를 해당 클러스터에 동기화한다.
# destination.server는 클러스터를 Argo CD에 등록한 뒤 실제 주소로 바꾼다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app-gcp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Crystal-SBHackathon2026/gitops.git
    targetRevision: main
    path: apps/sample-app/overlays/gcp
  destination:
    server: GCP_GKE_API_SERVER
    namespace: sample-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
