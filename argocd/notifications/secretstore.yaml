# ✅ 적용돼 있다 (2026-10-09). argocd 네임스페이스 전용 ESO 컨트롤러가 이 파일들을 읽는다.
#   external-secrets-argocd  --namespace=argocd   sa: external-secrets-argocd
#   external-secrets         --namespace=platform sa: external-secrets
# 컨트롤러가 네임스페이스마다 하나씩이라 ClusterSecretStore 는 여전히 필요하지 않다.
# argocd 네임스페이스에서 Secrets Manager 를 읽기 위한 SecretStore.
# platform/review-db 와 같은 spec 이다. auth 섹션이 없는 이유:
# 이 네임스페이스를 맡은 컨트롤러(external-secrets-argocd)의 Pod Identity 권한으로 읽기 때문이다.
# 그 역할은 oneaction/review-service 하나만 읽도록 제한돼 있다.
# IAM 은 인프라에서 관리한다 (-Terraform-infrastructure 이슈 #15).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: review-service
  namespace: argocd
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
