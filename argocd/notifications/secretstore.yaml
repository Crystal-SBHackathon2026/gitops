# ⚠️ 아직 적용하지 않는다. ESO 가 platform 네임스페이스에만 걸려 있다.
#   external-secrets 컨트롤러 args: --namespace=platform
#                                   --enable-cluster-store-reconciler=false
#   그래서 argocd 네임스페이스의 SecretStore·ExternalSecret 은 컨트롤러가 보지 않고
#   상태조차 붙지 않는다. ClusterSecretStore CRD 도 설치돼 있지 않다.
#
# 지금은 README 의 수동 절차로 토큰을 넣는다. 인프라에서 ESO 범위를 넓히면
# (--namespace 제거 또는 argocd 네임스페이스 추가) 이 두 파일을 적용하고
# 수동으로 넣은 키를 ESO 가 관리하도록 넘긴다.
# argocd 네임스페이스에서 Secrets Manager 를 읽기 위한 SecretStore.
# platform/review-db 와 같은 spec 이다. auth 섹션이 없는 이유:
# ESO 컨트롤러(external-secrets/external-secrets)의 Pod Identity 권한으로 읽기 때문이다.
# 그래서 네임스페이스마다 따로 권한을 줄 필요가 없고 이 파일만 두면 된다.
# 읽을 Secret 의 IAM 권한은 인프라에서 관리한다 (-Terraform-infrastructure 이슈 #13).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: review-service
  namespace: argocd
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
