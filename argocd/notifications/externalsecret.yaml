# ⚠️ 아직 적용하지 않는다. ESO 가 platform 네임스페이스에만 걸려 있다.
#   external-secrets 컨트롤러 args: --namespace=platform
#                                   --enable-cluster-store-reconciler=false
#   그래서 argocd 네임스페이스의 SecretStore·ExternalSecret 은 컨트롤러가 보지 않고
#   상태조차 붙지 않는다. ClusterSecretStore CRD 도 설치돼 있지 않다.
#
# 지금은 README 의 수동 절차로 토큰을 넣는다. 인프라에서 ESO 범위를 넓히면
# (--namespace 제거 또는 argocd 네임스페이스 추가) 이 두 파일을 적용하고
# 수동으로 넣은 키를 ESO 가 관리하도록 넘긴다.
# Argo CD Notifications 가 검토 서비스 웹훅을 부를 때 쓰는 Bearer 토큰.
# argocd-notifications-secret 은 Argo CD 설치가 이미 만들어 둔 Secret 이라
# creationPolicy: Merge 로 키 하나만 넣는다(Owner 로 하면 설치가 만든 Secret 을 가져간다).
# 토큰 값은 Secrets Manager 에만 있고 git·슬랙·문서에 남기지 않는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: review-service
    kind: SecretStore
  target:
    name: argocd-notifications-secret
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: ARGOCD_WEBHOOK_TOKEN
      remoteRef:
        key: oneaction/review-service
        property: ARGOCD_WEBHOOK_TOKEN
