# ✅ 적용돼 있다 (2026-10-09). argocd 네임스페이스 전용 ESO 컨트롤러가 이 파일들을 읽는다.
#   external-secrets-argocd  --namespace=argocd   sa: external-secrets-argocd
#   external-secrets         --namespace=platform sa: external-secrets
# 컨트롤러가 네임스페이스마다 하나씩이라 ClusterSecretStore 는 여전히 필요하지 않다.
# Argo CD Notifications 가 검토 서비스 웹훅을 부를 때 쓰는 Bearer 토큰.
# argocd-notifications-secret 은 Argo CD 설치가 이미 만들어 둔 Secret 이라
# creationPolicy: Merge 로 키 하나만 넣는다(Owner 로 하면 설치가 만든 Secret 을 가져간다).
# 토큰 값은 Secrets Manager 에만 있고 git·슬랙·문서에 남기지 않는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: review-service
    kind: SecretStore
  target:
    name: argocd-notifications-secret
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: ARGOCD_WEBHOOK_TOKEN
      remoteRef:
        key: oneaction/review-service
        property: ARGOCD_WEBHOOK_TOKEN
