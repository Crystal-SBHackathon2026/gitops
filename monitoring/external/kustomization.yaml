# 다른 클러스터의 지표를 서울 Prometheus 가 직접 긁게 하는 설정.
#
# 전용 Application(argocd/monitoring-external-aws.yaml)이 이 경로를 본다.
# 모니터링 묶음(argocd/monitoring-aws.yaml)에 넣지 않은 이유는 대시보드 쪽과 같다 —
# 그 Application 은 소스가 Helm 차트 저장소라 **gitops 레포를 읽지 않는다**.
# 거기 넣으면 파일을 고쳐도 머지만으로는 반영되지 않는다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - tokyo.yaml
  # 부산은 터널 주소가 있어야 켤 수 있다. 준비만 해뒀다 — busan.yaml.disabled 참고.
  # 켤 때: 파일 이름에서 .disabled 를 떼고 아래 줄의 주석을 푼다.
  # - busan.yaml
