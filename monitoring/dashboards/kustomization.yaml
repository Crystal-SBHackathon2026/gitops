# Grafana 대시보드를 ConfigMap 으로 만든다. Grafana 의 sidecar 가 집어간다.
#
# 🔴 라벨 값이 "1" 이어야 한다. 있기만 해선 안 된다.
#   sidecar 설정: LABEL=grafana_dashboard, LABEL_VALUE=1, NAMESPACE=ALL,
#                 FOLDER_ANNOTATION=grafana_folder   (실제로 확인함)
#
# 왜 모니터링 묶음(argocd/monitoring-aws.yaml 의 extraManifests)에 안 넣었나 —
# 그 Application 은 소스가 Helm 차트 저장소라 **gitops 레포를 읽지 않는다**
# (리비전이 91.9.0 이다). 거기 넣으면 파일을 고쳐도 머지만으로는 반영되지 않고
# kubectl apply 를 매번 다시 해야 한다. 10/9 에 ServiceMonitor 로 한 번 걸렸다.
#
# 이 경로는 전용 Application(argocd/monitoring-dashboards-aws.yaml)이 gitops 레포를
# 직접 보므로, 대시보드를 고쳐 머지하면 Argo CD 가 알아서 반영한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

configMapGenerator:
  - name: dashboard-sample-app
    files:
      - sample-app.json

generatorOptions:
  # 이름 뒤에 해시를 붙이지 않는다. 붙으면 고칠 때마다 ConfigMap 이 새로 생기고
  # 옛것이 지워지면서 sidecar 가 대시보드를 지웠다 다시 만든다.
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    # 폴더가 나뉘어 있다 — apps/(이성진) · platform/(김혜연)
    grafana_folder: apps
